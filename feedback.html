<!DOCTYPE html>
<html>
<head>
    <title>Feedback - My Portfolio</title>
    <style>
        .feedback-form {
            max-width: 600px;
            margin: 50px auto;
            padding: 30px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .feedback-form h2 {
            color: #1a73e8;
            text-align: center;
        }
        .feedback-form textarea {
            width: 100%;
            height: 150px;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .feedback-form button {
            background: #1a73e8;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="feedback-form">
        <h2>Help Me Improve My Portfolio</h2>
        <p>As a junior data analyst, I'm constantly looking to improve. If you have 2 minutes, please share:</p>
        <form action="mailto:muhammadtayyab8838@gmail.com" method="post" enctype="text/plain">
            <textarea name="feedback" placeholder="What stands out? What's confusing? What's missing?"></textarea>
            <br>
            <button type="submit">Send Feedback</button>
        </form>
        <p style="margin-top: 20px; font-size: 0.9em; color: #666;">
            Your feedback helps me become a better analyst. Thank you!
        </p>
    </div>
</body>
</html>
